# Pause of Urban-Alert-multimedia without deprovisioning: stops billing and keeps every piece of data.
# Only DocumentDB costs money while idle, so this stops the cluster (scripts/docdb-estado.sh: the AWS provider has
# no Terraform resource for its running state). The Lambda functions, the routes and the images bucket stay.
# Usually run by the Pausar workflow of urban-alert-plataforma; Provision starts the cluster again.
name: Pausar

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe urban-alert-multimedia para confirmar la pausa (los datos se conservan)"
        required: true
        type: string

# Same group as Provision and Deprovision: runs touching this infrastructure never overlap.
concurrency:
  group: urban-alert-multimedia-aws
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOCDB_CLUSTER: urban-alert-multimedia-docdb

jobs:
  pausar:
    name: Pause Urban-Alert-multimedia
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "urban-alert-multimedia" ]; then
            echo "::error::Confirmation missing: type urban-alert-multimedia. Nothing was changed."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main (the AWS role only trusts main). Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Stop DocumentDB (data, snapshots and protection stay)
        run: scripts/docdb-estado.sh detener "$DOCDB_CLUSTER"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Urban-Alert-multimedia en pausa"
            echo "- DocumentDB \`$DOCDB_CLUSTER\` detenido con sus datos; funciones, rutas y bucket de imágenes sin cambios."
            echo "- Para volver: workflow **Reanudar** de urban-alert-plataforma (o Provision de este repo, ya sin pausa)."
          } >> "$GITHUB_STEP_SUMMARY"
